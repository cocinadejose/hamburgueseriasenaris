<!-- Comportamiento del selector de idioma. Delegado en fase de captura: funciona en
     todas las páginas y anula los scripts antiguos por página (evita el doble toggle). -->
<script>
(function () {
    if (window.__senarisLangDropdownInit) return;
    window.__senarisLangDropdownInit = true;

    document.addEventListener('click', function (e) {
        var btn = document.getElementById('langDropdownBtn');
        var list = document.getElementById('langDropdown');
        if (!btn || !list) return;

        if (btn.contains(e.target)) {
            e.stopPropagation();
            var abierto = list.style.display === 'block';
            list.style.display = abierto ? 'none' : 'block';
            btn.setAttribute('aria-expanded', String(!abierto));
        } else if (!list.contains(e.target)) {
            list.style.display = 'none';
            btn.setAttribute('aria-expanded', 'false');
        }
    }, true);
})();
</script>
